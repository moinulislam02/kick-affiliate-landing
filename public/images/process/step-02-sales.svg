<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="bg-glow-2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e0e12" stop-opacity="0"/>
    </radialGradient>
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="480" fill="#0f0f12"/>
  <rect width="700" height="480" fill="url(#bg-glow-2)"/>

  <!-- 3 Connected Pipeline Cards -->
  <g transform="translate(45, 110)">
    
    <!-- Mini Card 1: Customer places order -->
    <g transform="translate(0, 0)" filter="url(#subtle-shadow)">
      <rect width="180" height="260" rx="18" fill="#141418" stroke="#27272a" stroke-width="1.5"/>
      
      <!-- Icon -->
      <rect x="20" y="22" width="40" height="40" rx="10" fill="#1e1e24" stroke="#27272a"/>
      <path d="M32 34 h16 l-3 8 h-10 z" stroke="#d4d4d8" stroke-width="1.5" fill="none"/>
      <circle cx="35" cy="46" r="2" fill="#d4d4d8"/>
      <circle cx="45" cy="46" r="2" fill="#d4d4d8"/>

      <text x="20" y="92" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Customer places</text>
      <text x="20" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">order</text>

      <text x="20" y="138" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="normal">A new order comes in</text>
      <text x="20" y="154" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="normal">via link or coupon</text>

      <!-- Pill -->
      <rect x="20" y="200" width="140" height="34" rx="8" fill="#0b0b0e" stroke="#27272a"/>
      <text x="90" y="222" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">@David • $198.00</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(192, 125)">
      <path d="M0 0 L16 0 M10 -6 L16 0 L10 6" stroke="#52525b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Mini Card 2 (Auto-approve referrals - HIGHLIGHTED) -->
    <g transform="translate(220, -10)" filter="url(#purple-glow)">
      <rect width="190" height="280" rx="18" fill="#1b132e" stroke="#a855f7" stroke-width="1.8"/>
      
      <!-- Icon -->
      <rect x="20" y="22" width="42" height="42" rx="10" fill="#2e1d4a" stroke="#c084fc" stroke-width="1.2"/>
      <path d="M34 40 L42 46 M38 36 L46 42" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round"/>

      <text x="20" y="96" fill="#f3e8ff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Auto-approve</text>
      <text x="20" y="116" fill="#f3e8ff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">referrals</text>

      <text x="20" y="146" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="normal">Attribute new sales to</text>
      <text x="20" y="164" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="normal">affiliate immediately</text>

      <!-- Pill -->
      <rect x="20" y="214" width="150" height="36" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.2"/>
      <text x="95" y="237" fill="#f5d0fe" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" text-anchor="middle">@Emma • via EMMA20</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(422, 125)">
      <path d="M0 0 L16 0 M10 -6 L16 0 L10 6" stroke="#52525b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Mini Card 3: Commission added -->
    <g transform="translate(450, 0)" filter="url(#subtle-shadow)">
      <rect width="180" height="260" rx="18" fill="#141418" stroke="#27272a" stroke-width="1.5"/>
      
      <!-- Icon -->
      <rect x="20" y="22" width="40" height="40" rx="10" fill="#1e1e24" stroke="#27272a"/>
      <text x="40" y="48" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">$</text>

      <text x="20" y="92" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Commission</text>
      <text x="20" y="110" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">added</text>

      <text x="20" y="138" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="normal">Rate applied</text>
      <text x="20" y="154" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="normal">automatically</text>

      <!-- Pill -->
      <rect x="20" y="200" width="140" height="34" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-opacity="0.5"/>
      <text x="90" y="222" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">$198 × 20% = $39.60</text>
    </g>

  </g>
</svg>
