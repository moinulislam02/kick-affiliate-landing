<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="bg-glow-4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e0e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="progress-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="card-shadow-4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="480" fill="#0f0f12"/>
  <rect width="700" height="480" fill="url(#bg-glow-4)"/>

  <!-- Center Card -->
  <g transform="translate(130, 85)" filter="url(#card-shadow-4)">
    <rect width="440" height="310" rx="20" fill="#16161a" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Header info -->
    <g transform="translate(32, 36)">
      <rect width="36" height="36" rx="10" fill="#78350f" stroke="#d97706" stroke-width="1"/>
      <text x="18" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">★</text>

      <text x="48" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">VIP Tier Multiplier</text>

      <!-- Badge -->
      <rect x="250" y="4" width="126" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="313" y="22" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" text-anchor="middle">+25% AUTO BOOST</text>
    </g>

    <!-- Progress section -->
    <g transform="translate(32, 110)">
      <text x="0" y="0" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="12">Tier Milestone: $10,000 Volume</text>
      <text x="376" y="0" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13" font-weight="bold" text-anchor="end">88%</text>

      <rect y="12" width="376" height="10" rx="5" fill="#27272a"/>
      <rect y="12" width="330" height="10" rx="5" fill="url(#progress-grad)"/>
    </g>

    <!-- Divider -->
    <line x1="32" y1="175" x2="408" y2="175" stroke="#27272a" stroke-width="1"/>

    <!-- Leaderboard Ranks -->
    <g transform="translate(32, 200)">
      <!-- Row 1 -->
      <rect width="376" height="38" rx="10" fill="#0f0f12" stroke="#27272a"/>
      <circle cx="20" cy="19" r="10" fill="#e11d48"/>
      <text x="20" y="23" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1</text>
      <text x="40" y="24" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">@Sarah_Style</text>
      <text x="360" y="24" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" text-anchor="end">$4,250.00</text>

      <!-- Row 2 -->
      <g transform="translate(0, 46)">
        <rect width="376" height="38" rx="10" fill="#0f0f12" stroke="#27272a"/>
        <circle cx="20" cy="19" r="10" fill="#6366f1"/>
        <text x="20" y="23" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2</text>
        <text x="40" y="24" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">@Alex_Trends</text>
        <text x="360" y="24" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" text-anchor="end">$3,890.00</text>
      </g>
    </g>
  </g>
</svg>
